# Local processing worker. Supabase runs via `supabase start`; this adds MinIO
# as a local S3 stand-in for R2 so the full pipeline works offline.
services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: clipthread
      MINIO_ROOT_PASSWORD: clipthread-dev-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]

  minio-setup:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 clipthread clipthread-dev-secret; do sleep 1; done;
      mc mb -p local/clipthread-media;
      mc anonymous set none local/clipthread-media;
      "

  worker:
    build: ./worker
    env_file: ./worker/.env
    environment:
      # Reach `supabase start` and MinIO from inside the container
      SUPABASE_URL: http://host.docker.internal:54321
      R2_ENDPOINT: http://minio:9000
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["8000:8000"]
    depends_on: [minio-setup]

volumes:
  minio-data:
