# Minimal Supabase CLI config. `supabase start` fills in defaults for anything omitted.
project_id = "clipthread"

[api]
port = 54321
schemas = ["public"]

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
port = 54323

[inbucket]
port = 54324

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
# Lets visitors record without creating an account; every consent record still
# gets a stable auth.users id.
enable_anonymous_sign_ins = true

[auth.email]
enable_signup = true
enable_confirmations = false

[realtime]
enabled = true
